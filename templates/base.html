<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuitWell — Oral Cancer & Smoking AI</title>

  <!-- ✅ Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    /* === Theme Colors === */
    :root {
      --dark-bg: #000000;
      --light-bg: #E9E3DF;
      --accent: #FF7A30;
      --blue: #465C88;
      --white: #ffffff;
    }

    body {
      background-color: var(--light-bg);
      color: var(--blue);
      font-family: "Poppins", sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden; /* ✅ Prevent horizontal scroll */
    }

    /* === Navbar === */
    .navbar {
      background-color: var(--dark-bg);
      padding: 1rem 2rem;
    }

    .navbar-brand {
      color: var(--accent);
      font-weight: 700;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .navbar-brand:hover {
      color: var(--white);
    }

    .navbar-nav .nav-link {
      color: var(--white);
      font-weight: 500;
      margin: 0 10px;
      transition: all 0.3s ease;
    }

    .navbar-nav .nav-link:hover {
      color: var(--accent);
    }

    .navbar-nav .nav-link.active {
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
    }

    /* === Main Container Full Width === */
    main.container-fluid {
      width: 100%;
      padding: 0; /* remove extra space */
      min-height: 100vh; /* full height */
    }

    /* === Footer === */
    footer {
      background-color: var(--dark-bg);
      color: var(--light-bg);
      text-align: center;
      padding: 20px 10px;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    footer p {
      margin: 0;
    }

    /* === Buttons === */
    .btn-accent {
      background-color: var(--accent);
      color: var(--white);
      border-radius: 25px;
      padding: 10px 25px;
      font-weight: 600;
      transition: all 0.3s ease;
      border: none;
    }

    .btn-accent:hover {
      background-color: var(--blue);
      color: var(--white);
    }

    .btn-outline-accent {
      border: 2px solid var(--accent);
      color: var(--accent);
      border-radius: 25px;
      padding: 10px 25px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-outline-accent:hover {
      background-color: var(--accent);
      color: var(--white);
    }
  </style>
</head>

<body>
  <!-- 🌐 Navigation Bar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('home') }}">QuitWell</a>
      <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link {% if request.endpoint == 'predict' %}active{% endif %}" href="{{ url_for('predict') }}">Predict</a></li>
          <li class="nav-item"><a class="nav-link {% if request.endpoint == 'ai_features' %}active{% endif %}" href="{{ url_for('ai_features') }}">AI Smoking Impact</a></li>
          <li class="nav-item"><a class="nav-link {% if request.endpoint == 'chatbot_page' %}active{% endif %}" href="{{ url_for('chatbot_page') }}">Quit Coach</a></li>
          <li class="nav-item"><a class="nav-link {% if request.endpoint == 'tracker' %}active{% endif %}" href="{{ url_for('tracker') }}">Progress Tracker</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 🧭 Main Content (Full Width, No Scroll) -->
  <main class="container-fluid">
    {% block content %}{% endblock %}
  </main>

  <!-- ⚙️ Footer -->
  <footer>
    <p>QuitWell • AI Demo — Not Medical Advice</p>
  </footer>
</body>
</html>
