{% extends "base.html" %}
{% block content %}

<section style="
    position: relative;
    min-height: 100vh;
    padding: 40px 0;
    background: url('https://media.istockphoto.com/id/1224408037/photo/world-no-tobacco-day-may-31st-no-smoking-day-poison-of-cigarette.jpg?s=612x612&w=0&k=20&c=eTiqDWD1roN5U3QqNraKZCebdhWc7EGFLGBPiOIaLCc=')
    center/cover no-repeat;
">
    <div style="
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(1px);
    "></div>

  <div style="position: relative; z-index: 2;" class="container-fluid" style="max-width:1400px;">
    <div class="row">

      <!-- LEFT PANE — IMAGE ONLY -->
      <div class="col-md-4 d-none d-md-flex align-items-center justify-content-start">
        <img src="https://static.vecteezy.com/system/resources/thumbnails/053/017/434/small/cute-friendly-ai-robot-chatbot-assistant-isolated-on-transparent-background-png.png"
             alt="Quit Coach"
             style="
                width:95%;
                height:auto;
                margin-left:0;
             ">
      </div>

      <!-- RIGHT PANE — WHATSAPP CHAT -->
      <div class="col-md-8">

        <h2 class="fw-bold mb-4 text-center" style="color:#FF7A30;">
          Quit Coach Chatbot
        </h2>

        <div class="chat-wrapper shadow-lg"
          style="
            background:#ECE5DD;
            height:80vh;
            border-radius:25px;
            border:4px solid #FF7A30;
            display:flex;
            flex-direction:column;
          ">

          <!-- Chat Messages -->
          <div id="chatbox"
            style="
              flex-grow:1;
              padding:20px;
              overflow-y:auto;
              border-radius: 25px;
              background:#ECE5DD;
              display:flex;
              flex-direction:column;
            ">
          </div>

          <!-- Input Box -->
          <form id="chat-form"
            style="
              padding:15px;
              background:#FFF;
              border-top:3px solid #FF7A30;
              display:flex;
              gap:10px;
            ">

            <input id="chat-input" type="text" required placeholder="Type a message"
              class="form-control"
              style="
                background:#FFF;
                border-radius:25px;
                border:2px solid #FF7A30;
                padding:10px 18px;
              ">

            <button class="btn fw-bold"
              style="
                background:#FF7A30;
                color:#fff;
                border-radius:25px;
                padding:10px 20px;
              ">Send</button>

          </form>

        </div>

      </div>
    </div>
  </div>

</section>

<!-- CHAT SCRIPT -->
<script>
const chatBox = document.getElementById('chatbox');

function appendMessage(text, who='bot') {
    const bubble = document.createElement('div');

    if (who === 'bot') {
        bubble.classList.add('bot-bubble');
    } else {
        bubble.classList.add('user-bubble');
    }

    bubble.innerText = text;
    chatBox.appendChild(bubble);
    chatBox.scrollTop = chatBox.scrollHeight;
}

document.getElementById("chat-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const input = document.getElementById("chat-input");
    const msg = input.value.trim();
    if (!msg) return;

    appendMessage(msg, "user");
    input.value = "";

    try {
        const resp = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg })
        });

        const data = await resp.json();
        appendMessage(data.reply || "No reply", "bot");
    } catch (e) {
        appendMessage("Error connecting to server", "bot");
    }
});
</script>

<!-- WHATSAPP CHAT STYLES -->
<style>

#chatbox {
    display:flex;
    flex-direction:column;
}

/* BOT BUBBLE — LEFT */
.bot-bubble {
    max-width: 75%;
    padding: 12px 15px;
    background:#FFF3B0;
    color:#111;
    border-radius: 10px 10px 10px 2px;
    margin-bottom: 12px;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
    font-size:0.95rem;

    align-self:flex-start;
    margin-right:auto;
}

/* USER BUBBLE — RIGHT */
.user-bubble {
    max-width: 75%;
    padding: 12px 15px;
    background:#FFFFFF;
    color:#111;
    border-radius: 10px 10px 2px 10px;
    margin-bottom: 12px;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
    font-size:0.95rem;

    align-self:flex-end;
    margin-left:auto;
}

/* Scrollbar */
#chatbox::-webkit-scrollbar {
    width:7px;
}
#chatbox::-webkit-scrollbar-thumb {
    background:#FF7A30;
    border-radius: 10px;
}

</style>

{% endblock %}
